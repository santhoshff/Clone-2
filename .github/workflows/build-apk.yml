name: Build APK

# Debug-signed APK; needs no secrets. Runs on every push to main, or manually from
# Actions -> Build APK -> Run workflow. The APK is attached to the "latest" Release
# and also uploaded as a run artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDevDebug -PevaBuild=${{ github.run_number }} --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          set -e
          find app/build/outputs -name "*.apk" -print
          APK=$(find app/build/outputs -name "*arm64-v8a*.apk" | head -1)
          UNI=$(find app/build/outputs -name "*universal*.apk" | head -1)
          test -n "$UNI" && cp "$UNI" EvaMusic-debug-universal.apk
          test -n "$APK"
          cp "$APK" EvaMusic-debug.apk
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging EvaMusic-debug.apk | grep -E "^(package|application-label:|launchable-activity|uses-permission: name='android.permission.(POST_NOTIFICATIONS|FOREGROUND_SERVICE_MEDIA_PLAYBACK)')" | tee badging.txt
          grep -q "application-label:'Eva Music'" badging.txt
          grep -q "EvaWebActivity" badging.txt
          unzip -l EvaMusic-debug.apk | grep -q "assets/eva/index.html"
          ls -lh EvaMusic-debug*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eva-music-debug-apk
          path: EvaMusic-debug*.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          { echo "eva-build: ${{ github.run_number }}"; echo; cat RELEASE_NOTES.md; } > notes.md
          gh release create latest EvaMusic-debug.apk EvaMusic-debug-universal.apk --prerelease \
            --title "Eva Music (latest build)" --notes-file notes.md
